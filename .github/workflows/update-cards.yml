name: Update profile cards

on:
  schedule:
    - cron: "0 */6 * * *"   # a cada 6 horas
  workflow_dispatch:         # botao "Run workflow"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/avatar.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: Gerar cards
        run: python scripts/generate.py
        env:
          # Usa o PAT (opcional) se existir; senao o token padrao do Actions
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated
          git diff --staged --quiet || (git commit -m "chore: update profile cards" && git push)
